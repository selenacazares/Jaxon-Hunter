<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SAS – Accès Sécurisé</title>

<style>
body {
    background: radial-gradient(circle at center, #0a0a0a 0%, #050505 100%);
    color: #00ff9c;
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
    font-size: 18px;
}

/* grain écran */
body::after {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
    opacity: 0.15;
    pointer-events: none;
}

#terminal {
    max-width: 900px;
    margin: auto;
    position: relative;
}

/* scan */
#terminal::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 2px;
    background: rgba(0,255,156,0.15);
    animation: scan 6s linear infinite;
}

@keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
}

.line {
    margin: 6px 0;
    text-shadow: 0 0 6px #00ff9c;
}

.menu span {
    display: block;
    cursor: pointer;
    font-size: 20px;
}

.menu span:hover {
    color: white;
}

.identity-container {
    display: flex;
    gap: 30px;
    margin-top: 20px;
}

.identity-photo {
    width: 180px;
    height: 220px;
    border: 2px solid #00ff9c;
    box-shadow: 0 0 10px #00ff9c;
    overflow: hidden;
}

.identity-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) contrast(120%);
}

.glitch {
    animation: glitch 0.3s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-1px,1px); }
    40% { transform: translate(1px,-1px); }
    60% { transform: translate(-1px,0); }
    80% { transform: translate(1px,1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, delay = 20) {
    return new Promise(resolve => {
        const line = document.createElement("div");
        line.classList.add("line");
        terminal.appendChild(line);

        let i = 0;
        function typing() {
            if (i < text.length) {
                line.textContent += text.charAt(i);
                i++;
                setTimeout(typing, delay);
            } else resolve();
        }
        typing();
    });
}

function clearTerminal() {
    terminal.innerHTML = "";
}

async function bootSequence() {
    clearTerminal();

    await typeLine("SAN ANDREAS SECURITY (SAS)");
    await typeLine("DÉPARTEMENT DES OPÉRATIONS SPÉCIALES");
    await typeLine("> ------------------------------------------");
    await typeLine("> INITIALISATION...");
    await typeLine("> CONNEXION AU SERVEUR...");
    await typeLine("> CHIFFREMENT VALIDÉ");
    await typeLine("> CHARGEMENT....07%");
    await typeLine("> CHARGEMENT....23%");
    await typeLine("> CHARGEMENT....54%");
    await typeLine("> CHARGEMENT....89%");
    await typeLine("> CHARGEMENT TERMINÉ");
    await typeLine("> ACCÈS AUTORISÉ");
    await typeLine("> ------------------------------------------");
    await typeLine("> BIENVENUE, OPÉRATEUR");
    await typeLine("> ------------------------------------------");
    await typeLine("");

    showMainMenu();
}
    
/* MENU PRINCIPAL */
async function showMainMenu() {
    clearTerminal();

    await typeLine("SAN ANDREAS SECURITY (SAS)");
    await typeLine("DÉPARTEMENT DES OPÉRATIONS SPÉCIALES");
    await typeLine("> ------------------------------------------");
    await typeLine("Veuillez sélectionner un dossier");
    await typeLine("> ------------------------------------------");
    await typeLine("");

    const menu = document.createElement("div");
    menu.classList.add("menu");

    menu.innerHTML = `
        <span onclick="loadSection('garm')">[1] GARM - DOSSIER PERSONNEL</span>
        <span onclick="loadSection('fenrir')">[2] FENRIR - DOSSIER PERSONNEL</span>
        <span onclick="loadSection('psy')">[3] RAPPORTS PSYCHOLOGIQUES</span>
        <span onclick="loadSection('classified')">[4] DOSSIERS CONFIDENTIELS</span>
    `;

    terminal.appendChild(menu);
}

/* SECTIONS */
async function loadSection(section) {
    clearTerminal();

    if (section === "garm") {
        terminal.innerHTML = `
        <div class="identity-container">
            <div>
                <div class="line">DOSSIER – GARM</div>
                <div class="line">------------------------------------------</div>
                <div class="line">Nom : HUNTER</div>
                <div class="line">Prénom : JAXON</div>
                <div class="line">Alias : GARM</div>
                <div class="line">Statut : ACTIF (SAS)</div>
                <div class="line">Ancien statut : SORTIE VOLONTAIRE</div>
                <div class="line">Lien : Santoro Vega (Frère)</div>
            </div>
            <div class="identity-photo">
                <img src="https://i.goopics.net/ltop6d.jpg">
            </div>
        </div>`;
    }

    if (section === "fenrir") {
        terminal.innerHTML = `
        <div class="identity-container">
            <div>
                <div class="line">DOSSIER – FENRIR</div>
                <div class="line">------------------------------------------</div>
                <div class="line">Nom : VEGA</div>
                <div class="line">Prénom : SANTORO</div>
                <div class="line">Alias : FENRIR</div>
                <div class="line">Statut : ACTIF (SAS)</div>
                <div class="line">Ancien statut : DÉCÉDÉ (ANNULÉ)</div>
                <div class="line">Lien : Jaxon Hunter (Frère)</div>
            </div>
            <div class="identity-photo">
                <img src="https://i.goopics.net/8z6var.jpg">
            </div>
        </div>`;
    }

    if (section === "psy") {
        await typeLine("RAPPORT PSYCHOLOGIQUE :");
        await typeLine("- Loyauté extrême");
        await typeLine("- Obéissance sélective");
        await typeLine("- Forte résistance mentale");
    }

    if (section === "classified") {
        await typeLine("> NIVEAU OMEGA");
        await typeLine("> AUTHENTIFICATION REQUISE");
        await typeLine("");

        const input = document.createElement("input");
        input.type = "password";
        input.style.background = "black";
        input.style.color = "#00ff9c";
        input.style.border = "1px solid #00ff9c";

        terminal.appendChild(input);
        input.focus();

        input.addEventListener("keydown", async (e) => {
            if (e.key === "Enter") {
                if (input.value === "07235489") {

                    clearTerminal();

                    await typeLine("> ACCÈS AUTORISÉ");
                    await typeLine("“On rentre ensemble… ou pas du tout.”");

                    const glitch = document.createElement("div");
                    glitch.textContent = "██████████████";
                    glitch.classList.add("line","glitch");
                    terminal.appendChild(glitch);

                } else {
                    await typeLine("> ACCÈS REFUSÉ");
                    input.value = "";
                }
            }
        });
    }

    /* RETOUR MENU */
    const back = document.createElement("div");
    back.classList.add("line");
    back.textContent = "> RETOUR MENU";
    back.style.cursor = "pointer";

    back.onclick = () => {
        showMainMenu();
    };

    terminal.appendChild(back);
}

/* BOOT */
showMainMenu();
</script>

</body>
</html>
