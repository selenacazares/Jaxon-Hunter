<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SAS – Accès Sécurisé</title>

<style>
body {
    background: radial-gradient(circle at center, #0a0a0a 0%, #050505 100%);
    color: #00ff9c;
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
    font-size: 18px;
}

/* grain écran */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
    opacity: 0.15;
    pointer-events: none;
}

#terminal {
    max-width: 900px;
    margin: auto;
    position: relative;
}

/* scan */
#terminal::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 2px;
    background: rgba(0, 255, 156, 0.15);
    animation: scan 6s linear infinite;
}

@keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
}

.line {
    margin: 6px 0;
    text-shadow: 0 0 6px #00ff9c;
}

.menu {
    margin-top: 20px;
}

.menu span {
    display: block;
    cursor: pointer;
    font-size: 20px;
}

.menu span:hover {
    color: white;
}

.identity-container {
    display: flex;
    gap: 30px;
    margin-top: 20px;
}

.identity-photo {
    width: 180px;
    height: 220px;
    border: 2px solid #00ff9c;
    box-shadow: 0 0 10px #00ff9c;
    overflow: hidden;
}

.identity-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) contrast(120%);
}

.glitch {
    animation: glitch 0.3s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-1px, 1px); }
    40% { transform: translate(1px, -1px); }
    60% { transform: translate(-1px, 0); }
    80% { transform: translate(1px, 1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, delay = 20) {
    return new Promise(resolve => {
        const line = document.createElement("div");
        line.classList.add("line");
        terminal.appendChild(line);

        let i = 0;
        function typing() {
            if (i < text.length) {
                line.textContent += text.charAt(i);
                i++;
                setTimeout(typing, delay);
            } else {
                resolve();
            }
        }
        typing();
    });
}

async function bootSequence() {
    await typeLine("SAN ANDREAS SECURITY (SAS)");
    await typeLine("DÉPARTEMENT DES OPÉRATIONS SPÉCIALES");
    await typeLine("");
    await typeLine("> INITIALISATION...");
    await typeLine("> CONNEXION AU SERVEUR...");
    await typeLine("> CHIFFREMENT VALIDÉ");
    await typeLine("> ...");
    await typeLine("> ...");
    await typeLine("");
    await typeLine("> ACCÈS AUTORISÉ");
    await typeLine("> BIENVENUE, OPÉRATEUR ");
    await typeLine("");
    await typeLine("> CHARGEMENT DU DOSSIER : GARM");
    showMenu();
}

function showMenu() {
    const menu = document.createElement("div");
    menu.classList.add("menu");

    menu.innerHTML = `
        <span onclick="loadSection('identite')">[1] IDENTITÉ</span>
        <span onclick="loadSection('historique')">[2] BACKGROUND</span>
        <span onclick="loadSection('psy')">[3] RAPPORTS PSYCHOLOGIQUE</span>
        <span onclick="loadSection('classified')">[4] DOSSIERS CLASSIFIÉS</span>
    `;

    terminal.appendChild(menu);
}

function clearTerminal() {
    terminal.innerHTML = "";
}

async function loadSection(section) {
    clearTerminal();

    if (section === "identite") {
        const container = document.createElement("div");
        container.classList.add("identity-container");

        const text = document.createElement("div");

        text.innerHTML = `
        <div class="line">DOSSIER INDIVIDUEL – DOSSIER CONFIDENTIEL </div>
        <div class="line">------------------------------------------</div>
        <div class="line"></div>
        <div class="line">Nom : HUNTER</div>
        <div class="line">Prénom : JAXON</div>
        <div class="line">Alias : GARM</div>
        <div class="line">Statut : ACTIF (SAS)</div>
        <div class="line">Ancien statut : SORTIE VOLONTAIRE</div>
        <div class="line">Liens: Santoro Vega (Frère)</div>
        `;

        const photo = document.createElement("div");
        photo.classList.add("identity-photo");
        photo.innerHTML = `<img src="https://i.goopics.net/ltop6d.jpg>`;

        container.appendChild(text);
        container.appendChild(photo);
        terminal.appendChild(container);
    }

    if (section === "Background") {
        await typeLine("Ancien opérateur d’une unité spécialisée.");
        await typeLine("Opérations extérieures classifiées.");
        await typeLine("");
        await typeLine("Compétences :");
        await typeLine("- Commandement");
        await typeLine("- Gestion du stress");
        await typeLine("- Cohésion d’escouade");
    }

    if (section === "incident") {
        await typeLine("[OPÉRATION : CLASSIFIÉE]");
        await typeLine("Unité sous feu ennemi.");
        await typeLine("SANTORO : Sacrifice pour repli.");
        await typeLine("Statut : MORT AU COMBAT");
    }

    if (section === "RAPPORTS PSYCHOLOGIQUES") {
        await typeLine("Changement comportemental détecté :");
        await typeLine("- Discipline réduite");
        await typeLine("- Engagement accru");
        await typeLine("- Obéissance sélective");
        await typeLine("");
        await typeLine("Efficacité maintenue.");
    }

    if (section === "DOSSIER CLASSIFIE - ACCES RECQUIS") {
        await typeLine("> NIVEAU OMEGA REQUIS");
        await typeLine("> ACCÈS FORCÉ...");
        await typeLine("");
        await typeLine("SANTORO : RÉAPPARITION CONFIRMÉE");
        await typeLine("");
        await typeLine("“On rentre ensemble… ou pas du tout.”");
        await typeLine("");
        await typeLine("SUJET LIÉ : FENRIR");

        const glitch = document.createElement("div");
        glitch.textContent = "████████████████████";
        glitch.classList.add("line", "glitch");
        terminal.appendChild(glitch);
    }

    await typeLine("");
    const back = document.createElement("div");
back.classList.add("line");
back.textContent = "> RETOUR MENU";
back.style.cursor = "pointer";

back.onclick = () => {
    clearTerminal();
    showMenu();
};

terminal.appendChild(back);
    showMenu();
}

/* glitch aléatoire */
setInterval(() => {
    if (Math.random() < 0.1) {
        document.body.style.filter = "brightness(1.5)";
        setTimeout(() => {
            document.body.style.filter = "brightness(1)";
        }, 80);
    }
}, 3000);

bootSequence();
</script>

</body>
</html>
