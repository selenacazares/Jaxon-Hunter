<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SAS – Accès Sécurisé</title>

<style>
body {
    background: radial-gradient(circle, #0a0a0a, #050505);
    color: #00ff9c;
    font-family: "Courier New", monospace;
    padding: 20px;
    font-size: 18px;
}

/* TEXT */
.line { margin: 6px 0; }
.label { font-weight: bold; }

/* TITRES */
.header-main {
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0 0 12px #00ff9c;
}

.header-sub {
    font-size: 20px;
    text-shadow: 0 0 8px #00ff9c;
    opacity: 0.9;
}
    
.section-title {
    font-size: 20px;
    text-shadow: 0 0 6px #00ff9c;
}

/* MENU */
.menu span {
    display: block;
    padding: 6px;
    cursor: pointer;
}
.menu span:hover {
    background: #00ff9c;
    color: black;
}


/* SPLIT */
.psy-container {
    display: flex;
    gap: 30px;
}
.psy-column { flex: 1; }
.psy-divider {
    width: 2px;
    background: #00ff9c;
    box-shadow: 0 0 6px #00ff9c;
}
.psy-title {
    font-size: 20px;
    text-shadow: 0 0 6px #00ff9c;
}

/* GLITCH */
.glitch { animation: glitch 0.3s infinite; }
@keyframes glitch {
    0% {transform: translate(0);}
    50% {transform: translate(1px,-1px);}
    100% {transform: translate(0);}
}
/* CADRE GLOBAL DOSSIER */
.identity-card {
    border: 1px solid #00ff9c;
    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 0 10px rgba(0,255,156,0.3);
}

/* LAYOUT */
.identity-container {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 40px;
}

/* TEXTE */
.identity-left {
    flex: 1;
}

/* PHOTO CARREE */
.identity-photo {
    width: 180px;
    height: 180px;
    border: 2px solid #00ff9c;
    box-shadow: 0 0 10px #00ff9c;
    position: relative;
}

.identity-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
}

/* LABEL */
.identity-photo::before {
    content: "ID PHOTO";
    position: absolute;
    top: -18px;
    left: 0;
    font-size: 12px;
    color: #00ff9c;
}


    
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed = 20) {
    return new Promise(resolve => {
        const line = document.createElement("div");
        line.classList.add("line");
        terminal.appendChild(line);
        let i = 0;
        function typing() {
            if (i < text.length) {
                line.textContent += text[i++];
                setTimeout(typing, speed);
            } else resolve();
        }
        typing();
    });
}

function clearTerminal() {
    terminal.innerHTML = "";
}

function renderHeader(subtitle = "DÉPARTEMENT DES OPÉRATIONS SPÉCIALES") {

    const main = document.createElement("div");
    main.classList.add("line", "header-main");
    main.textContent = "SAN ANDREAS SECURITY (SAS)";
    terminal.appendChild(main);

    const sub = document.createElement("div");
    sub.classList.add("line", "header-sub");
    sub.textContent = subtitle; // 🔥 dynamique
    terminal.appendChild(sub);

    const separator = document.createElement("div");
    separator.classList.add("line");
    separator.textContent = "------------------------------------------";
    terminal.appendChild(separator);
}
    
/* BOOT */
async function bootSequence() {
    clearTerminal();

    renderHeader();
    await typeLine("> INITIALISATION...");
    await typeLine("> CONNEXION AU SERVEUR...");
    await typeLine("------------------------------------------");
    await typeLine("> CHARGEMENT....07%");
    await typeLine("> CHARGEMENT....23%");
    await typeLine("> CHARGEMENT....54%");
    await typeLine("> CHARGEMENT....89%");
    await typeLine("> CHARGEMENT TERMINÉ");
    await typeLine("------------------------------------------");
    await typeLine("> BIENVENUE, OPÉRATEUR");
    await typeLine("");

    showMenuAfterBoot();
}

/* MENU APRÈS BOOT */
function showMenuAfterBoot() {
    const menu = document.createElement("div");
    menu.classList.add("menu");
    menu.innerHTML = `
        <span onclick="loadSection('garm')">[1] DOSSIER PERSONNEL - GARM</span>
        <span onclick="loadSection('fenrir')">[2] DOSSIER PERSONNEL - FENRIR</span>

        <span onclick="loadSection('classified')">[4] DOSSIERS CONFIDENTIELS (Accès sécurisé)</span>
    `;
    terminal.appendChild(menu);
}

/* MENU SIMPLE */
function showSimpleMenu() {
    clearTerminal();

    renderHeader();

    const menu = document.createElement("div");
    menu.classList.add("menu");

    }


    /* PSY */
        if (section === "psy") {

</body>
</html>
