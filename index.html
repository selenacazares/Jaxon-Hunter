<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SAS – Accès Sécurisé</title>

<style>
body {
    background: radial-gradient(circle, #0a0a0a, #050505);
    color: #00ff9c;
    font-family: "Courier New", monospace;
    padding: 20px;
    font-size: 18px;
}

.line {
    margin: 6px 0;
}

/* TITRES */
.main-title {
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 0 5px #00ff9c;
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 6px #00ff9c;
    margin-top: 15px;
}

/* LABELS */
.label {
    font-weight: bold;
}

/* MENU */
.menu span {
    display: block;
    cursor: pointer;
    font-size: 20px;
}
.menu span:hover {
    color: white;
}

/* LAYOUT */
.identity-container {
    display: flex;
    gap: 30px;
    align-items: flex-start;
}

.identity-photo {
    width: 180px;
    height: 220px;
    border: 2px solid #00ff9c;
    box-shadow: 0 0 6px #00ff9c;
}

.identity-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
}

/* GLITCH */
.glitch {
    animation: glitch 0.3s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-1px,1px); }
    40% { transform: translate(1px,-1px); }
    60% { transform: translate(-1px,0); }
    80% { transform: translate(1px,1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed = 20) {
    return new Promise(resolve => {
        const line = document.createElement("div");
        line.classList.add("line");
        terminal.appendChild(line);

        let i = 0;
        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                i++;
                setTimeout(typing, speed);
            } else resolve();
        }
        typing();
    });
}

function clearTerminal() {
    terminal.innerHTML = "";
}

/* BOOT */
async function bootSequence() {
    clearTerminal();

    await typeLine("SAN ANDREAS SECURITY (SAS)");
    await typeLine("DÉPARTEMENT DES OPÉRATIONS SPÉCIALES");
    await typeLine("> ------------------------------------------");
    await typeLine("> INITIALISATION...");
    await typeLine("> CONNEXION AU SERVEUR...");
    await typeLine("> CHIFFREMENT VALIDÉ");
    await typeLine("> CHARGEMENT....07%");
    await typeLine("> CHARGEMENT....23%");
    await typeLine("> CHARGEMENT....54%");
    await typeLine("> CHARGEMENT....89%");
    await typeLine("> CHARGEMENT TERMINÉ");
    await typeLine("> ACCÈS AUTORISÉ");
    await typeLine("> BIENVENUE, OPÉRATEUR");
    await typeLine("");

    menu();
}

/* MENU */
function menu() {
    const menu = document.createElement("div");
    menu.classList.add("menu");

    menu.innerHTML = `
        <span onclick="loadSection('garm')">[1] DOSSIER PERSONNEL - GARM</span>
        <span onclick="loadSection('fenrir')">[2] DOSSIER PERSONNEL - FENRIR</span>
        <span onclick="loadSection('psy')">[3] RAPPORTS PSYCHOLOGIQUES</span>
        <span onclick="loadSection('classified')">[4] DOSSIERS CONFIDENTIELS (Accès sécurisé)</span>
    `;

    terminal.appendChild(menu);
}

function showMainMenu() {
    clearTerminal();
    menu();
}

/* SECTIONS */
async function loadSection(section) {
    clearTerminal();

    if (section === "garm") {
        terminal.innerHTML = `
        <div class="identity-container">
            <div>
                <div class="line main-title">DOSSIER – GARM</div>
                <div class="line">════════════════════════════</div>

                <div class="line"><span class="label">Nom :</span> HUNTER</div>
                <div class="line"><span class="label">Prénom :</span> JAXON</div>
                <div class="line"><span class="label">Alias :</span> GARM</div>
                <div class="line"><span class="label">Statut :</span> ACTIF (SAS)</div>
                <div class="line"><span class="label">Ancien statut :</span> SORTIE VOLONTAIRE</div>
                <div class="line"><span class="label">Lien :</span> Santoro Vega (Frère)</div>
            </div>

            <div class="identity-photo">
                <img src="https://i.goopics.net/ltop6d.jpg">
            </div>
        </div>

        <div class="line section-title">HISTORIQUE MILITAIRE</div>
        <div class="line">════════════════════════════</div>

        <div class="line">Ancien opérateur d’une unité spécialisée engagée dans des opérations extérieures classifiées.</div>
        <div class="line">Le sujet s’est rapidement imposé comme élément central de son unité grâce à :</div>
        <div class="line">- ses capacités de commandement</div>
        <div class="line">- sa gestion du stress en situation critique</div>
        <div class="line">- sa cohésion avec son escouade</div>
        <div class="line">Reconnu pour maintenir ses hommes opérationnels dans des conditions extrêmes.</div>

        <div class="line section-title">INCIDENT MAJEUR</div>
        <div class="line">════════════════════════════</div>

        <div class="line">Lors d’une mission à haut risque, l’unité du sujet a été prise sous feu ennemi.</div>
        <div class="line">➡️ SANTORO s’est sacrifié pour couvrir le repli.</div>
        <div class="line">Conséquences :</div>
        <div class="line">- Disparition de l’opérateur</div>
        <div class="line">- Déclaré mort au combat</div>

        <div class="line section-title">ÉVÉNEMENT EXCEPTIONNEL</div>
        <div class="line">════════════════════════════</div>

        <div class="line">Réapparition confirmée de SANTORO.</div>
        `;
    }

    if (section === "fenrir") {
        terminal.innerHTML = `
        <div class="identity-container">
            <div>
                <div class="line main-title">DOSSIER – FENRIR</div>
                <div class="line">════════════════════════════</div>

                <div class="line"><span class="label">Nom :</span> VEGA</div>
                <div class="line"><span class="label">Prénom :</span> SANTORO</div>
                <div class="line"><span class="label">Alias :</span> FENRIR</div>
                <div class="line"><span class="label">Statut :</span> ACTIF (SAS)</div>
                <div class="line"><span class="label">Ancien statut :</span> DÉCÉDÉ (ANNULÉ)</div>
            </div>

            <div class="identity-photo">
                <img src="https://i.goopics.net/8z6var.jpg">
            </div>
        </div>

        <div class="line section-title">HISTORIQUE</div>
        <div class="line">════════════════════════════</div>

        <div class="line">Ancien membre d’une unité spécialisée engagée dans des opérations extérieures à haut risque.</div>
        <div class="line">Compétences : infiltration, combat rapproché, adaptation.</div>

        <div class="line section-title">STATUT EXCEPTIONNEL</div>
        <div class="line">════════════════════════════</div>

        <div class="line">Réapparition après déclaration de décès.</div>
        <div class="line">État psychologique instable.</div>
        `;
    }

    if (section === "psy") {
        terminal.innerHTML = `
        <div class="line section-title">RAPPORTS PSYCHOLOGIQUES</div>
        <div class="line">════════════════════════════</div>

        <div class="line"><span class="label">GARM :</span> Loyauté extrême, désobéissance possible</div>
        <div class="line"><span class="label">FENRIR :</span> Instable, déclencheurs inconnus</div>
        `;
    }

    if (section === "classified") {
        await typeLine("> NIVEAU OMEGA");
        await typeLine("> AUTHENTIFICATION REQUISE");

        const input = document.createElement("input");
        input.type = "password";
        input.style.background = "black";
        input.style.color = "#00ff9c";
        input.style.border = "1px solid #00ff9c";

        terminal.appendChild(input);
        input.focus();

        input.addEventListener("keydown", async (e) => {
            if (e.key === "Enter") {

                if (input.value === "07235489") {

                    clearTerminal();

                    await typeLine("ACCÈS VALIDÉ");

                    terminal.innerHTML += `
                    <div class="line glitch">“Si Fenrir devient incontrôlable…</div>
                    <div class="line glitch">Garm est la seule variable de stabilisation.”</div>
                    `;

                } else {
                    await typeLine("> ACCÈS REFUSÉ");
                    input.value = "";
                }
            }
        });
    }

    const back = document.createElement("div");
    back.classList.add("line");
    back.textContent = "> RETOUR MENU";
    back.style.cursor = "pointer";
    back.onclick = showMainMenu;

    terminal.appendChild(back);
}

/* START */
bootSequence();
</script>

</body>
</html>
