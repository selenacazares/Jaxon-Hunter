<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SAS – Accès Sécurisé</title>

<style>
body {
    background: radial-gradient(circle, #0a0a0a, #050505);
    color: #00ff9c;
    font-family: "Courier New", monospace;
    padding: 20px;
    font-size: 18px;
}

.line {
    margin: 6px 0;
}

/* SEPARATION DE PAGE */
.psy-container {
    display: flex;
    gap: 30px;
    margin-top: 20px;
}

.psy-column {
    flex: 1;
}

.psy-divider {
    width: 2px;
    background: #00ff9c;
    box-shadow: 0 0 6px #00ff9c;
}

.psy-title {
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 6px #00ff9c;
    margin-bottom: 10px;
}

/* TITRES */
.main-title {
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 0 5px #00ff9c;
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 6px #00ff9c;
    margin-top: 15px;
}

/* HEADER */
.header-main {
    font-size: 26px;
    font-weight: bold;
    text-shadow: 0 0 10px #00ff9c;
}

.header-sub {
    font-size: 18px;
    opacity: 0.8;
}

/* MENU INTERACTIF */
.menu span {
    display: inline-block;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 20px;
    transition: 0.2s;
}

.menu span:hover {
    background: #00ff9c;
    color: black;
    box-shadow: 0 0 10px #00ff9c;
}

.menu span:active {
    background: #00ff9c;
    color: black;
    transform: scale(0.98);
}

/* LABELS */
.label {
    font-weight: bold;
}

/* LAYOUT */
.identity-container {
    display: flex;
    gap: 30px;
    align-items: flex-start;
}

.identity-photo {
    width: 180px;
    height: 220px;
    border: 2px solid #00ff9c;
    box-shadow: 0 0 6px #00ff9c;
}

.identity-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
}

/* GLITCH */
.glitch {
    animation: glitch 0.3s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-1px,1px); }
    40% { transform: translate(1px,-1px); }
    60% { transform: translate(-1px,0); }
    80% { transform: translate(1px,1px); }
    100% { transform: translate(0); }
}

/* correction glitch Fenrir */
.psy-column:last-child .psy-title {
    animation: glitch 1s infinite;
}
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed = 20) {
    return new Promise(resolve => {
        const line = document.createElement("div");
        line.classList.add("line");
        terminal.appendChild(line);

        let i = 0;
        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                i++;
                setTimeout(typing, speed);
            } else resolve();
        }
        typing();
    });
}

function clearTerminal() {
    terminal.innerHTML = "";
}

/* BOOT */
async function bootSequence() {
    clearTerminal();

    const main = document.createElement("div");
    main.classList.add("line", "header-main");
    main.textContent = "SAN ANDREAS SECURITY (SAS)";
    terminal.appendChild(main);

    const sub = document.createElement("div");
    sub.classList.add("line", "header-sub");
    sub.textContent = "DÉPARTEMENT DES OPÉRATIONS SPÉCIALES";
    terminal.appendChild(sub);

    await typeLine("> ------------------------------------------");
    await typeLine("> INITIALISATION...");
    await typeLine("> CONNEXION AU SERVEUR...");
    await typeLine("> CHIFFREMENT VALIDÉ");
    await typeLine("> CHARGEMENT....07%");
    await typeLine("> CHARGEMENT....23%");
    await typeLine("> CHARGEMENT....54%");
    await typeLine("> CHARGEMENT....89%");
    await typeLine("> CHARGEMENT TERMINÉ");
    await typeLine("> ACCÈS AUTORISÉ");
    await typeLine("> BIENVENUE, OPÉRATEUR");
    await typeLine("");

    menu();
}

/* MENU */
function menu() {
    const menu = document.createElement("div");
    menu.classList.add("menu");

    menu.innerHTML = `
        <span onclick="loadSection('garm')">[1] DOSSIER PERSONNEL - GARM</span><br>
        <span onclick="loadSection('fenrir')">[2] DOSSIER PERSONNEL -  FENRIR</span><br>
        <span onclick="loadSection('psy')">[3] RAPPORTS PSYCHOLOGIQUES</span><br>
        <span onclick="loadSection('classified')">[4] DOSSIERS CONFIDENTIELS (Accès sécurisé) </span>
    `;

    terminal.appendChild(menu);
}

function showMainMenu() {
    clearTerminal();
    bootSequence();
}

/* SECTIONS */
async function loadSection(section) {
    clearTerminal();

    // 👉 TES BLOCS GARM / FENRIR / PSY ICI (inchangés)

    if (section === "classified") {
        await typeLine("> NIVEAU OMEGA");
        await typeLine("> AUTHENTIFICATION REQUISE");

        const input = document.createElement("input");
        input.type = "password";
        input.style.background = "black";
        input.style.color = "#00ff9c";
        input.style.border = "1px solid #00ff9c";

        terminal.appendChild(input);
        input.focus();

        input.addEventListener("keydown", async (e) => {
            if (e.key === "Enter") {

                if (input.value === "07235489") {

                    clearTerminal();

                    await typeLine("ACCÈS VALIDÉ – NIVEAU OMEGA");
                    await typeLine("> ------------------------------------------");
                    await typeLine("");

                    terminal.innerHTML += `
                    <div class="line">DOSSIERS CONFIDENTIELS</div>
                    <div class="line">==========================================</div>

                    <div class="line"></div>
                    <div class="line">SUJET : VEGA, SANTORO (FENRIR)</div>
                    <div class="line">------------------------------------------</div>

                    <div class="line">DÉCISION DU COMMANDEMENT :</div>
                    <div class="line">- Statut administratif incohérent</div>
                    <div class="line">- Risques psychologiques identifiés</div>
                    <div class="line">- Réintégration impossible</div>

                    <div class="line"></div>
                    <div class="line">➡ SORTIE ADMINISTRATIVE CONTRÔLÉE</div>

                    <div class="line"></div>
                    <div class="line">TRANSFERT : SAN ANDREAS SECURITY (SAS)</div>
                    <div class="line">------------------------------------------</div>

                    <div class="line">- Surveillance indirecte</div>
                    <div class="line">- Exploitation opérationnelle</div>

                    <div class="line"></div>
                    <div class="line">STATUT ACTUEL :</div>
                    <div class="line">Nom : FENRIR</div>
                    <div class="line">Niveau : ACTIF</div>

                    <div class="line"></div>
                    <div class="line">==========================================</div>

                    <div class="line"></div>
                    <div class="line">SUJET : HUNTER, JAXON (GARM)</div>
                    <div class="line">------------------------------------------</div>

                    <div class="line">➡ SORTIE VOLONTAIRE ENCADRÉE</div>

                    <div class="line"></div>
                    <div class="line">TRANSFERT SAS :</div>
                    <div class="line">- Surveillance</div>
                    <div class="line">- Encadrement terrain</div>

                    <div class="line"></div>
                    <div class="line">STATUT :</div>
                    <div class="line">Nom : GARM</div>
                    <div class="line">Niveau : MODÉRÉ</div>

                    <div class="line"></div>
                    <div class="line">------------------------------------------</div>

                    <div class="line glitch">[NOTE INTERNE NON ARCHIVÉE]</div>
                    <div class="line glitch">“Si Fenrir devient incontrôlable…</div>
                    <div class="line glitch">Garm est la seule variable de stabilisation.”</div>
                    `;

                    const glitch = document.createElement("div");
                    glitch.textContent = "██████████████";
                    glitch.classList.add("line","glitch");
                    terminal.appendChild(glitch);

                } else {

                    await typeLine("");
                    await typeLine("> AUTHENTIFICATION ÉCHOUÉE");
                    await typeLine("> IDENTIFIANT NON VALIDE");
                    await typeLine("> JOURNALISATION EN COURS...");
                    input.value = "";
                }
            }
        });
    }

    const back = document.createElement("div");
    back.classList.add("line");
    back.textContent = "> RETOUR MENU";
    back.style.cursor = "pointer";
    back.onclick = showMainMenu;

    terminal.appendChild(back);
}

/* START */
bootSequence();
</script>

</body>
</html>
