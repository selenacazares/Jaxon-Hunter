<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
body {
    background: radial-gradient(circle, #0a0a0a, #050505);
    color: #00ff9c;
    font-family: "Courier New", monospace;
    padding: 20px;
    font-size: 18px;
}

.line {
    margin: 6px 0;
    text-shadow: 0 0 6px #00ff9c;
}

.menu span {
    display: block;
    cursor: pointer;
    font-size: 20px;
}

.menu span:hover {
    color: white;
}

.identity-container {
    display: flex;
    gap: 30px;
    margin-top: 20px;
}

.identity-photo {
    width: 180px;
    height: 220px;
    border: 2px solid #00ff9c;
    box-shadow: 0 0 10px #00ff9c;
}

.identity-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
}

.glitch {
    animation: glitch 0.3s infinite;
}

.psy-container {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.psy-column {
    flex: 1;
}

.psy-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
}

.separator {
    width: 2px;
    background: #00ff9c;
    box-shadow: 0 0 8px #00ff9c;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-1px,1px); }
    40% { transform: translate(1px,-1px); }
    60% { transform: translate(-1px,0); }
    80% { transform: translate(1px,1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed = 20) {
    return new Promise(resolve => {
        const line = document.createElement("div");
        line.classList.add("line");
        terminal.appendChild(line);

        let i = 0;
        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                i++;
                setTimeout(typing, speed);
            } else resolve();
        }
        typing();
    });
}

function clearTerminal() {
    terminal.innerHTML = "";
}

/* BOOT */
async function bootSequence() {
    clearTerminal();

    await typeLine("SAN ANDREAS SECURITY (SAS)");

    await typeLine("> INITIALISATION...");
    await typeLine("> CONNEXION AU SERVEUR...");
    await typeLine("> CHIFFREMENT VALIDÉ");
    await typeLine("> CHARGEMENT....07%");
    await typeLine("> CHARGEMENT....23%");
    await typeLine("> CHARGEMENT....54%");
    await typeLine("> CHARGEMENT....89%");
    await typeLine("> CHARGEMENT TERMINÉ");
    await typeLine("> ACCÈS AUTORISÉ");
    await typeLine("> ------------------------------------------");
    await typeLine("> BIENVENUE, OPÉRATEUR");
    await typeLine("");

    showMenu();
}

/* MENU */

    terminal.appendChild(menu);
}
