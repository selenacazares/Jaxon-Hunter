<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SAS – Accès Sécurisé</title>

<style>
body {
    background: radial-gradient(circle, #0a0a0a, #050505);
    color: #00ff9c;
    font-family: "Courier New", monospace;
    padding: 20px;
    font-size: 18px;
}

/* TEXT */
.line { margin: 6px 0; }
.label { font-weight: bold; }

/* TITRES */
.header-main {
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0 0 12px #00ff9c;
}

.header-sub {
    font-size: 20px;
    text-shadow: 0 0 8px #00ff9c;
    opacity: 0.9;
}
    
.section-title {
    font-size: 20px;
    text-shadow: 0 0 6px #00ff9c;
}

/* MENU */
.menu span {
    display: block;
    padding: 6px;
    cursor: pointer;
}
.menu span:hover {
    background: #00ff9c;
    color: black;
}

/* LAYOUT */
.identity-container {
    display: flex;
    gap: 30px;
}
.identity-photo {
    width: 180px;
    border: 2px solid #00ff9c;
}

/* SPLIT */
.psy-container {
    display: flex;
    gap: 30px;
}
.psy-column { flex: 1; }
.psy-divider {
    width: 2px;
    background: #00ff9c;
    box-shadow: 0 0 6px #00ff9c;
}
.psy-title {
    font-size: 20px;
    text-shadow: 0 0 6px #00ff9c;
}

/* GLITCH */
.glitch { animation: glitch 0.3s infinite; }
@keyframes glitch {
    0% {transform: translate(0);}
    50% {transform: translate(1px,-1px);}
    100% {transform: translate(0);}
}

.identity-container {
    display: flex;
    justify-content: space-between;
    gap: 40px;
    margin-top: 15px;
}

.identity-left {
    flex: 1;
}

.identity-photo {
    width: 200px;
    height: 260px;
    border: 2px solid #00ff9c;
    box-shadow: 0 0 10px #00ff9c;
    position: relative;
}

.identity-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
}

/* effet cadre stylé */
.identity-photo::before {
    content: "ID PHOTO";
    position: absolute;
    top: -18px;
    left: 0;
    font-size: 12px;
    color: #00ff9c;
}
    
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed = 20) {
    return new Promise(resolve => {
        const line = document.createElement("div");
        line.classList.add("line");
        terminal.appendChild(line);
        let i = 0;
        function typing() {
            if (i < text.length) {
                line.textContent += text[i++];
                setTimeout(typing, speed);
            } else resolve();
        }
        typing();
    });
}

function clearTerminal() {
    terminal.innerHTML = "";
}

function renderHeader() {
    const main = document.createElement("div");
    main.classList.add("line", "header-main");
    main.textContent = "SAN ANDREAS SECURITY (SAS)";
    terminal.appendChild(main);

    const sub = document.createElement("div");
    sub.classList.add("line", "header-sub");
    sub.textContent = "DÉPARTEMENT DES OPÉRATIONS SPÉCIALES";
    terminal.appendChild(sub);

    const separator = document.createElement("div");
    separator.classList.add("line");
    separator.textContent = "------------------------------------------";
    terminal.appendChild(separator);
}
    
/* BOOT */
async function bootSequence() {
    clearTerminal();

    renderHeader();
    await typeLine("------------------------------------------");
    await typeLine("> INITIALISATION...");
    await typeLine("> CONNEXION AU SERVEUR...");
    await typeLine("------------------------------------------");
    await typeLine("> CHARGEMENT....07%");
    await typeLine("> CHARGEMENT....23%");
    await typeLine("> CHARGEMENT....54%");
    await typeLine("> CHARGEMENT....89%");
    await typeLine("> CHARGEMENT TERMINÉ");
    await typeLine("------------------------------------------");
    await typeLine("> BIENVENUE, OPÉRATEUR");
    await typeLine("");

    showMenuAfterBoot();
}

/* MENU APRÈS BOOT */
function showMenuAfterBoot() {
    const menu = document.createElement("div");
    menu.classList.add("menu");
    menu.innerHTML = `
        <span onclick="loadSection('garm')">[1] DOSSIER PERSONNEL - GARM</span>
        <span onclick="loadSection('fenrir')">[2] DOSSIER PERSONNEL - FENRIR</span>
        <span onclick="loadSection('psy')">[3] RAPPORTS PSYCHOLOGIQUES</span>
        <span onclick="loadSection('classified')">[4] DOSSIERS CONFIDENTIELS (Accès sécurisé)</span>
    `;
    terminal.appendChild(menu);
}

/* MENU SIMPLE */
function showSimpleMenu() {
    clearTerminal();

    renderHeader();

    const menu = document.createElement("div");
    menu.classList.add("menu");

    menu.innerHTML += `
        <span onclick="loadSection('garm')">[1] DOSSIER PERSONNEL - GARM</span>
        <span onclick="loadSection('fenrir')">[2] DOSSIER PERSONNEL - FENRIR</span>
        <span onclick="loadSection('psy')">[3] RAPPORTS PSYCHOLOGIQUES</span>
        <span onclick="loadSection('classified')">[4] DOSSIERS CONFIDENTIELS (Accès sécurisé)</span>
    `;

    terminal.appendChild(menu);
}

/* SECTIONS */
async function loadSection(section) {
    clearTerminal();

    /* GARM */
    if (section === "garm") {
        terminal.innerHTML = `

        <div class="identity-container">
            <div>
                <div class="line main-title">DOSSIER – GARM</div>
                <div class="line">════════════════════════════</div>

                <div class="line"><span class="label">Nom :</span> HUNTER</div>
                <div class="line"><span class="label">Prénom :</span> JAXON</div>
                <div class="line"><span class="label">Alias :</span> GARM</div>
                <div class="line"><span class="label">Statut :</span> ACTIF (SAS)</div>
                <div class="line"><span class="label">Ancien statut :</span> SORTIE VOLONTAIRE</div>
                <div class="line"><span class="label">Lien :</span> Santoro Vega (Frère)</div>
            </div>

            <div class="identity-photo">
                <img src="https://i.goopics.net/8z6var.jpg">
            </div>
        </div>


        <div class="line section-title">HISTORIQUE MILITAIRE</div>
        <div class="line">════════════════════════════</div>

        <div class="line">Ancien opérateur d’une unité spécialisée engagée dans des opérations extérieures classifiées.</div>
        <div class="line">Le sujet s’est rapidement imposé comme élément central grâce à :</div>
        <div class="line">- Capacités de commandement</div>
        <div class="line">- Gestion du stress en situation critique</div>
        <div class="line">- Cohésion avec son escouade</div>
        <div class="line">Reconnu pour maintenir ses hommes opérationnels dans des conditions extrêmes.</div>


        <div class="line section-title">INCIDENT MAJEUR</div>
        <div class="line">════════════════════════════</div>

        <div class="line">Lors d’une mission à haut risque, l’unité du sujet a été prise sous feu ennemi.</div>
        <div class="line">SANTORO : Sacrifice pour couvrir le repli.</div>

        <div class="line"></div>
        <div class="line"><span class="label">Conséquences :</span></div>
        <div class="line">- Disparition de l’opérateur</div>
        <div class="line">- Déclaré mort au combat</div>


        <div class="line section-title">ÉVÉNEMENT EXCEPTIONNEL</div>
        <div class="line">════════════════════════════</div>

        <div class="line">Réapparition confirmée de SANTORO.</div>

        <div class="line"></div>
        <div class="line"><span class="label">Réaction du sujet HUNTER :</span></div>
        <div class="line">- Reconnaissance immédiate</div>
        <div class="line">- Contestation du commandement</div>
        <div class="line">- Demande d’accès aux dossiers classifiés</div>

        `;
    }

    /* FENRIR */
    if (section === "fenrir") {
    terminal.innerHTML += `

    <div class="identity-container">
        <div>
            <div class="line main-title">DOSSIER – FENRIR</div>
            <div class="line">════════════════════════════</div>

            <div class="line"><span class="label">Nom :</span> VEGA</div>
            <div class="line"><span class="label">Prénom :</span> SANTORO</div>
            <div class="line"><span class="label">Alias :</span> FENRIR</div>
            <div class="line"><span class="label">Statut :</span> ACTIF (SAS)</div>
            <div class="line"><span class="label">Ancien statut :</span> DÉCÉDÉ (ANNULÉ)</div>
            <div class="line"><span class="label">Lien :</span> Jaxon Hunter (Frère)</div>
        </div>

        <div class="identity-photo">
            <img src="https://i.goopics.net/ltop6d.jpg">
        </div>
    </div>


    <div class="line section-title">HISTORIQUE OPÉRATIONNEL</div>
    <div class="line">════════════════════════════</div>

    <div class="line">Ancien membre d’une unité spécialisée engagée dans des opérations extérieures à haut risque.</div>
    <div class="line">Le sujet s’est distingué par :</div>
    <div class="line">- Infiltration</div>
    <div class="line">- Combat rapproché</div>
    <div class="line">- Adaptation en environnement hostile</div>


    <div class="line">════════════════════════════</div>
    <div class="line section-title">OPÉRATION CLASSIFIÉE</div>
    <div class="line">════════════════════════════</div>

    <div class="line">Mission sous feu ennemi.</div>
    <div class="line">Couverture assurée pour le repli de l’unité.</div>

    <div class="line"></div>
    <div class="line"><span class="label">Conséquence officielle :</span></div>
    <div class="line">- Déclaré Mort au Combat</div>
    <div class="line">- Corps non récupéré</div>
    <div class="line">- Dossier archivé</div>


    <div class="line">════════════════════════════</div>
    <div class="line section-title">STATUT EXCEPTIONNEL</div>
    <div class="line">════════════════════════════</div>

    <div class="line">Réapparition confirmée après plusieurs années.</div>
    <div class="line"><span class="label">Circonstances :</span> INCONNUES</div>

    <div class="line"></div>
    <div class="line"><span class="label">État physique :</span> viable</div>
    <div class="line"><span class="label">État psychologique :</span> instable</div>
    <div class="line"><span class="label">Mémoire :</span> partiellement altérée</div>


    <div class="line">════════════════════════════</div>
    <div class="line section-title">STATUT ACTUEL</div>
    <div class="line">════════════════════════════</div>

    <div class="line">⚠ DOSSIER SURVEILLÉ ⚠</div>
    <div class="line">Enquête interne ouverte</div>
    <div class="line">Reclassée : SECRET DÉFENSE</div>

    `;
    }


    /* PSY */
    if (section === "psy") {
        renderHeader();
        
        terminal.innerHTML += `
        <div class="main-title">RAPPORTS PSYCHOLOGIQUES</div>

        <div class="psy-container">
            <div class="psy-column">
                <div class="psy-title">HUNTER, JAXON (GARM)</div>
                <div>- Attachement à SANTORO</div>
            </div>

            <div class="psy-divider"></div>

            <div class="psy-column">
                <div class="psy-title">VEGA, SANTORO (FENRIR)</div>
                <div>- Loyauté incertaine</div>
            </div>
        </div>
        `;
    }

    /* CLASSIFIED */
    if (section === "classified") {
        renderHeader();
        await typeLine("> NIVEAU OMEGA");
        await typeLine("> AUTHENTIFICATION REQUISE");

        const input = document.createElement("input");
        terminal.appendChild(input);
        input.focus();

        input.addEventListener("keydown", async (e) => {
            if (e.key === "Enter") {

                if (input.value === "07235489") {
                    clearTerminal();

                    terminal.innerHTML += `
                    <div class="main-title">DOSSIERS CONFIDENTIELS</div>

                    <div class="psy-container">

                        <div class="psy-column">
                            <div class="psy-title">HUNTER, JAXON (GARM)</div>
                            <div>➡ SORTIE VOLONTAIRE</div>
                        </div>

                        <div class="psy-divider"></div>

                        <div class="psy-column">
                            <div class="psy-title">VEGA, SANTORO (FENRIR)</div>
                            <div>➡ SORTIE CONTRÔLÉE</div>
                        </div>

                    </div>

                    <div class="glitch">████████████</div>
                    `;

                    addBackButton();
                }
            }
        });

        return;
    }

    addBackButton();
}

/* RETOUR */
function addBackButton() {
    const menu = document.createElement("div");
    menu.classList.add("menu");
    menu.innerHTML = `<span onclick="showSimpleMenu()">> RETOUR MENU</span>`;
    terminal.appendChild(menu);
}

/* START */
bootSequence();
</script>

</body>
</html>
